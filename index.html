<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Zaragoza</title>
  <link rel="stylesheet" href="style.css?v=20260804-3">
</head>
<body>

  <!-- STARTUP LOGO + TOP MENU BAR -->
  <header id="site-header">
    <button id="menu-toggle" aria-label="Open menu" aria-expanded="false">
      <span></span>
      <span></span>
      <span></span>
    </button>

    <!-- EDIT LOGO FILE HERE -->
    <img src="images/paper-street-soap.svg" id="site-logo" alt="Zaragoza Logo">
  </header>

  <!-- SUBMENU -->
  <nav id="submenu">
    <a href="/">Home</a>
    <a href="/work-done/">Work Done</a>
    <a href="/#contact">Contact</a>
  </nav>

  <div id="background-blur"></div>

  <main id="website-content">

    <!-- BLOCK 1 — TITLE -->
    <section id="home">
      <div class="title-block">
        <!-- EDIT TITLE TEXT HERE -->
        <h1 class="main-title">Zaragoza</h1>

        <!-- EDIT SUBTITLE TEXT HERE -->
        <p class="main-subtitle">edit me</p>
      </div>
    </section>

    <!-- BLOCK 2 — CUSTOM MEDIA SLIDESHOW -->
    <section id="slideshow-block">
      <div id="slideshow-box">

        <div class="picture-row row-1">
          <div class="picture-track" id="picture-track-1"></div>
        </div>

        <div class="picture-row row-2">
          <div class="picture-track" id="picture-track-2"></div>
        </div>

        <div class="picture-row row-3">
          <div class="picture-track" id="picture-track-3"></div>
        </div>

      </div>

      <!-- EDIT BLOCK 2 LINK TEXT / DESTINATION HERE -->
      <a class="slideshow-more-link" href="/work-done/">Edit Me <span aria-hidden="true">→</span></a>

    </section>

    <!-- ======================================
         BLOCK 3 — SUBTITLE / BODY + ELECTRIC SVG
         ====================================== -->
    <section id="block-3">

      <!-- SVG animation is injected here by script.js -->
      <div id="electric-art" aria-hidden="true"></div>

      <div class="block-3-copy">
        <!-- EDIT BLOCK 3 SUBTITLE TEXT HERE -->
        <h2 class="block-3-subtitle">Edit Me.</h2>

        <!-- EDIT BLOCK 3 BODY TEXT HERE -->
        <p class="block-3-body">Also Edit Me.</p>
      </div>

    </section>

    <!-- BLOCK 4 — FUTURE CONTACT -->
    <section id="contact" class="contact-block">

      <div class="slot-row slot-row-top" aria-label="Decorative lightning slot animation"></div>

      <div class="contact-copy">
        <!-- EDIT BLOCK 4 TITLE HERE -->
        <h2 class="contact-title">Contact</h2>

        <!-- EDIT EMAIL TEXT + ADDRESS HERE -->
        <a
          class="contact-email"
          href="mailto:insert-email-here@example.com"
        >Insert Email here</a>
      </div>

      <div class="slot-row slot-row-bottom" aria-label="Decorative lightning slot animation"></div>

    </section>

    <!-- BLOCK 5 — FUTURE FOOTER -->
  </main>

    <footer id="site-footer">
      <!-- EDIT FOOTER TEXT HERE -->
      <p class="footer-text">Made in NYC. 🗽</p>
    </footer>

  <script src="script.js?v=20260804-3"></script>
</body>
</html>
